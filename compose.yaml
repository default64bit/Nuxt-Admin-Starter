# Shared base. `compose.dev.yaml` (bind-mounted dev image with HMR) or `compose.prod.yaml` (registry images) is
# layered on top by the justfile. Optional pieces add services behind the profiles `media`, `monitoring`, `edge`
# and `backup`; `COMPOSE_PROFILES` in `.env` is the one list of what runs (ADR-0029). `ops` holds the one-shot jobs.
name: nuxt-admin-starter

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    # Docker's 64 MB default is too small for the parallel queries of larger reports.
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/postgres/10-create-app-role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [backend]
    logging: *logging

  app:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      PORT: 3000
      NUXT_APP_ENV: ${NUXT_APP_ENV:-production}
      NUXT_DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?Set NUXT_SESSION_PASSWORD in .env}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?Set the public site URL in .env}
    ports:
      - 127.0.0.1:${APP_HOST_PORT:-3000}:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [backend]
    logging: *logging

  # One-shot jobs (`just db-*`): run from the dev image locally and from the tools image in production.
  db-ensure:
    profiles: [ops]
    command: [corepack, pnpm, "db:ensure"]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL_DOCKER:?Set DATABASE_ADMIN_URL_DOCKER in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    logging: *logging

  migrate:
    profiles: [ops]
    command: [corepack, pnpm, "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    logging: *logging

  seed:
    profiles: [ops]
    command: [corepack, pnpm, "db:seed"]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}
      DEFAULT_ADMIN_PHONE: ${DEFAULT_ADMIN_PHONE:-}
      DEFAULT_ADMIN_GIVEN_NAME: ${DEFAULT_ADMIN_GIVEN_NAME:-}
      DEFAULT_ADMIN_FAMILY_NAME: ${DEFAULT_ADMIN_FAMILY_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    logging: *logging

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
