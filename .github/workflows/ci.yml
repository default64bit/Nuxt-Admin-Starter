name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  # The release workflow calls this one for pushes to main and version tags.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded develop pushes and PR runs are cancelled; a run called for a release is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}

env:
  CI: "true"

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    env:
      # nuxt typecheck can run out of memory with Node's default heap on a small hosted runner.
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
        with:
          just-version: 1.43.0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: just ci-install
      - run: just lint
      - run: just typecheck
      - run: just test
      - run: just build

  integration:
    name: Postgres-backed integration tests
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --max-old-space-size=5120
      # A role that may create and drop the throwaway databases the tests use.
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
        with:
          just-version: 1.43.0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: just ci-install
      - run: just db-check
      - run: just test-integration

  # Compose validation and every infra test that needs Docker. Each such test runs here and in no other job: they skip
  # unless INFRA_TESTS=1, which only `just test-compose` sets. Later infra pieces add their tests to this job.
  deploy-automation:
    name: Compose validation and Docker infra tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
        with:
          just-version: 1.43.0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: just ci-install
      # No .env exists in CI, so both resolve the committed .env.example (its COMPOSE_PROFILES included).
      - run: just compose-check
      - run: just test-compose

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v2
        with:
          just-version: 1.43.0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: just ci-install
      - run: just audit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
